{{- /*
The shared model cache PVC is created ONLY in shared mode (the default), unless
an existing claim is supplied. In perService mode the operator provisions a
per-InferenceService PVC at reconcile time (owner-ref'd to the InferenceService),
so the chart creates no shared PVC. See values.yaml modelCache.mode.
*/ -}}
{{- if and .Values.modelCache.enabled (eq .Values.modelCache.mode "shared") (not .Values.modelCache.existingClaim) }}
{{- if and .Values.modelCache.requireDefaultStorageClass (not .Values.modelCache.storageClass) }}
{{- /*
A live list response has an items key even when the cluster has no classes.
Offline helm template / client-side dry-run returns an empty dict instead, so
skip validation only in that case. API errors (including forbidden) propagate.
The Helm caller needs StorageClass list permission; opt out explicitly for
restricted callers or manually bound chart-managed claims. An already Bound
chart-managed claim skips this check on upgrade. This only checks default-class
selection, not provisioner health or available PV capacity.
*/ -}}
{{- $claimName := printf "%s-model-cache" (include "llmkube.fullname" .) }}
{{- $existing := lookup "v1" "PersistentVolumeClaim" (include "llmkube.namespace" .) $claimName }}
{{- if ne (dig "status" "phase" "" $existing) "Bound" }}
{{- $classes := lookup "storage.k8s.io/v1" "StorageClass" "" "" }}
{{- if hasKey $classes "items" }}
{{- include "llmkube.modelCache.requireDefaultStorageClass" $classes }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llmkube.fullname" . }}-model-cache
  namespace: {{ include "llmkube.namespace" . }}
  labels:
    {{- include "llmkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-cache
  {{- with .Values.modelCache.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.modelCache.accessMode }}
  {{- if .Values.modelCache.storageClass }}
  storageClassName: {{ .Values.modelCache.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
{{- end }}
